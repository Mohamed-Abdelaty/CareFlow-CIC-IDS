version: "3.8"

services:
  # ── Kafka + Zookeeper ──────────────────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks: [hpf-net]

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka
    depends_on: [zookeeper]
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks: [hpf-net]

  # ── PostgreSQL — unified metastore + operational DB ────────────────────────
  # Replaces SQLite (flow_submissions) + DuckDB (analytics reads).
  # Also serves as Airflow metastore (LocalExecutor — parallel task execution).
  # Big Data storage remains in Hadoop HDFS (Parquet) — SparkSQL reads from there.
  # FIX: external port changed to 5433 to avoid conflict with any local Postgres on Windows.
  # FIX: service name "postgres" is used as DB_HOST (guaranteed Docker DNS resolution).
  postgres:
    image: postgres:15
    container_name: careflow-postgres
    environment:
      POSTGRES_DB: careflow_ids
      POSTGRES_USER: careflow
      POSTGRES_PASSWORD: careflow_pass
    ports:
      - "5433:5432"        # host:container — avoids conflict with local Postgres on port 5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [hpf-net]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U careflow -d careflow_ids"]
      interval: 5s
      timeout: 5s
      retries: 15

  # ── HDFS ───────────────────────────────────────────────────────────────────
  namenode:
    image: apache/hadoop:3
    container_name: namenode
    hostname: namenode
    user: root
    entrypoint: >
      /bin/bash -c "
        cp /hadoop-config/* /opt/hadoop/etc/hadoop/ &&
        if [ ! -f /hadoop/dfs/name/current/VERSION ]; then
          hdfs namenode -format -force -nonInteractive;
        fi &&
        hdfs namenode
      "
    ports:
      - "9870:9870"
      - "9000:8020"
    volumes:
      - hdfs_namenode:/hadoop/dfs/name
      - ./hadoop-config:/hadoop-config
    networks: [hpf-net]

  datanode:
    image: apache/hadoop:3
    container_name: datanode
    hostname: datanode
    user: root
    entrypoint: >
      /bin/bash -c "
        cp /hadoop-config/* /opt/hadoop/etc/hadoop/ &&
        hdfs datanode
      "
    depends_on: [namenode]
    volumes:
      - hdfs_datanode:/hadoop/dfs/data
      - ./hadoop-config:/hadoop-config
    networks: [hpf-net]

  # ── Spark cluster ──────────────────────────────────────────────────────────
  spark-master:
    image: apache/spark:3.5.3
    container_name: spark-master
    user: root
    environment:
      - SPARK_NO_DAEMONIZE=true
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    ports:
      - "8080:8080"
      - "7077:7077"
    networks: [hpf-net]

  spark-worker:
    image: apache/spark:3.5.3
    container_name: spark-worker
    user: root
    depends_on: [spark-master]
    environment:
      - SPARK_WORKER_MEMORY=3g
      - SPARK_WORKER_CORES=2
    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.worker.Worker
      spark://spark-master:7077
    networks: [hpf-net]

  # ── Spark streaming processor ──────────────────────────────────────────────
  # Reads from Kafka → cleans → writes to HDFS (SparkSQL / Parquet).
  # Inference results written to PostgreSQL network_flows table.
  # flow_submissions status updated in PostgreSQL.
  # FIX: DB_HOST uses service name "postgres" for guaranteed Docker DNS resolution.
  spark-processor:
    build: ./spark
    container_name: spark-processor
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      namenode:
        condition: service_started
    restart: on-failure
    environment:
      - KAFKA_TOPIC=network_flows_stream
      - KAFKA_BOOTSTRAP=kafka:29092
      - HDFS_URI=hdfs://namenode:8020
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=careflow_ids
      - DB_USER=careflow
      - DB_PASS=careflow_pass
    volumes:
      - ./spark/jobs:/opt/jobs
      - ./data:/data
    networks: [hpf-net]

  # ── Airflow ────────────────────────────────────────────────────────────────
  # Uses PostgreSQL as metastore backend (LocalExecutor — parallel tasks).
  # FIX: DB host uses service name "postgres" in connection string.
  # FIX: airflow-webserver waits for airflow-init to complete successfully
  #      before starting, preventing migration collisions.
  airflow-init:
    build: ./airflow
    container_name: airflow-init
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://careflow:careflow_pass@postgres:5432/careflow_ids
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
    entrypoint: bash -c "airflow db migrate && airflow users create --username admin --password admin --firstname admin --lastname admin --role Admin --email admin@example.com || true"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./data:/data
    networks: [hpf-net]

  airflow-webserver:
    build: ./airflow
    container_name: airflow-webserver
    # FIX: wait for airflow-init to complete fully before webserver starts
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: on-failure
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://careflow:careflow_pass@postgres:5432/careflow_ids
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
    ports:
      - "8085:8080"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./data:/data
      - ./spark/jobs:/opt/jobs
    command: webserver
    networks: [hpf-net]

  airflow-scheduler:
    build: ./airflow
    container_name: airflow-scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: on-failure
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://careflow:careflow_pass@postgres:5432/careflow_ids
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./data:/data
      - ./spark/jobs:/opt/jobs
    command: scheduler
    networks: [hpf-net]

  # ── Kafka producer (LOCKED & DISABLED) ──────────────────────────────────
  # DATA COLLECTION IS COMPLETE — PRODUCER IS FULLY DISABLED.
  # All 16,232,943 flows are in Kafka.
  kafka-producer:
    profiles: ["disabled"]
    build: ./kafka/producer
    container_name: kafka-producer
    depends_on: [kafka]
    environment:
      - KAFKA_TOPIC=network_flows_stream
      - KAFKA_BOOTSTRAP=kafka:29092
      - SEND_DELAY=0.0
    volumes:
      - ./data:/data
    networks: [hpf-net]

  # ── FastAPI serving layer ──────────────────────────────────────────────────
  # Reads all data from PostgreSQL (flow_submissions, network_flows, analytics).
  # SparkSQL remains the Big Data processing engine on top of HDFS.
  # FIX: DB_HOST uses service name "postgres" for guaranteed Docker DNS resolution.
  api:
    build: ./api
    container_name: hpf-api
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    restart: on-failure
    ports:
      - "8000:8000"
    environment:
      - KAFKA_BOOTSTRAP=kafka:29092
      - KAFKA_TOPIC=network_flows_stream
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=careflow_ids
      - DB_USER=careflow
      - DB_PASS=careflow_pass
    volumes:
      - ./data:/data
    networks: [hpf-net]

  # ── Streamlit dashboard ────────────────────────────────────────────────────
  dashboard:
    build: ./dashboard
    container_name: hpf-dashboard
    depends_on: [api]
    ports:
      - "8501:8501"
    networks: [hpf-net]

volumes:
  hdfs_namenode:
  hdfs_datanode:
  postgres_data:     # PostgreSQL data — persisted between restarts

networks:
  hpf-net:
    driver: bridge
